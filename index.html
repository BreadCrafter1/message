<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>terminal chat</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#000;--fg:#ff3030;--dim:#9c1f1f;--bad:#ffb4b4;--me:#ff8a8a;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#ff3030}}
:root[data-theme="dark"]{--bg:#000;--fg:#ff3030}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Courier New',Courier,monospace;font-size:1rem;line-height:1.5;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:14px 0}
#log{flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.dim{color:var(--dim)}.bad{color:var(--bad)}.me{color:var(--me)}
form{display:flex;gap:.5rem;align-items:center;padding-top:10px;border-top:1px solid var(--dim)}
label{color:var(--dim);white-space:nowrap}
input{flex:1;min-width:0;font:inherit;font-size:16px;background:transparent;border:0;color:var(--fg);outline:0;padding:4px 0;caret-color:var(--fg)}
input:focus-visible{outline:0}
form:focus-within{border-top-color:var(--fg)}
#chat{display:none}
.in #chat{display:flex}.in #login{display:none}
#login{display:flex;flex-direction:column}
button{font:inherit;font-size:14px;background:transparent;color:var(--fg);border:1px solid var(--dim);padding:2px 8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg)}
#tools{display:flex;flex-wrap:wrap;gap:.5rem;padding:0 0 10px;margin-bottom:8px;border-bottom:1px solid var(--dim)}
#callbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:8px 0;border-top:1px solid var(--dim)}
#callbar[hidden]{display:none}
#cstat{flex:1;min-width:8rem}
#log img{display:block;max-width:100%;max-height:320px;margin:4px 0;border:1px solid var(--dim)}
#vids{display:none;gap:6px;padding:6px 0;position:relative}
#vids.on{display:flex}
#rv{width:100%;max-height:45vh;background:#000;border:1px solid var(--dim)}
#lv{position:absolute;right:8px;bottom:12px;width:28%;max-height:30%;border:1px solid var(--fg);background:#000;transform:scaleX(-1)}
#log audio{display:block;width:100%;max-width:320px;margin:4px 0}
#log a{color:var(--fg)}
#rec{color:var(--bad);border-color:var(--bad)}
.hq{font-size:12px}
</style>
</head>
<body>
<div id="app">
 <div id="login">
  <div id="lmsg">$ login<br><span class="dim">enter password to continue.</span></div>
  <form id="lf"><label for="pw">password:</label><input id="pw" type="password" autocomplete="off" autocapitalize="off" autofocus></form>
 </div>
 <div id="chat" style="flex-direction:column;height:100%">
  <div id="tools"><button type="button" id="att" aria-label="Attach file">[file]</button><button type="button" id="vm" aria-label="Voice message">[mic]</button><button type="button" id="cbtn" aria-label="Voice call">[call]</button><button type="button" id="vbtn" aria-label="Video call">[video]</button></div>
  <div id="log" role="log" aria-live="polite"></div>
  <div id="callbar" hidden><span id="cstat"></span><button type="button" id="cacc">[accept]</button><button type="button" id="cdec">[decline]</button><button type="button" id="cmute">[mute]</button><button type="button" id="ccam">[camera]</button><button type="button" id="chang">[hang up]</button></div>
  <div id="vids"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video></div>
  <audio id="remote" autoplay playsinline></audio>
  <form id="cf"><label id="prompt" for="msg">&gt;</label><input id="msg" type="text" autocomplete="off" autocapitalize="off" maxlength="500" enterkeyhint="send" aria-label="Message"><button type="submit" id="snd">[send]</button><input type="file" id="file" hidden></form>
 </div>
</div>
<script>
/* PASTE THE SEALED STRING FROM THE APP'S "/github seal" BETWEEN THE QUOTES (turns on the permanent GitHub history): */
var GH_SEAL="9t44aGTzzLiLZ7YXm34T/QsQJ/HVdHU/6uJRBUJ2Lo/N+UyZQsrGUbJtIyI39Xm7Dk4FdYz6xeBrY2j1aVcqI1dx7RIubVq2BrWFwP3Jdiru0K1/MdgwRjf54j2SgC+XaMzzT/VnHIc=";

(function(){
 var SALT="baFKjP+cjbOG8Xryf+/Izw==",ITER=300000,VER="DMlT+t2vcJ3DDliu/9DOKy6RlAbqF2ucMnMsjO9E",DEF="https://ntfy.sh/",HOST=DEF;
 try{var hh=localStorage.getItem('chat_host');if(hh&&/^https:\/\/[^\s]+\/$/.test(hh))HOST=hh;}catch(e){}
 var app=document.getElementById('app'),log=document.getElementById('log'),prompt_=document.getElementById('prompt');
 var enc=function(s){return new TextEncoder().encode(s)},dec=function(b){return new TextDecoder().decode(b)};
 var u8=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
 var b64=function(a){var s='';a.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)};
 var hex=function(a){return Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')};
 var key,topic,nick='',needNick=false,seen={},es=null;
 try{nick=localStorage.getItem('nick')||'';}catch(e){}

 function line(txt,cls){var d=document.createElement('div');if(cls)d.className=cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;}
 function setPrompt(){prompt_.textContent=(needNick?'nickname':nick)+' >';}
 function clean(n){return n.replace(/[^A-Za-z0-9_-]/g,'').slice(0,16);}

 async function derive(pw){
  var base=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},base,384));
  return {k:await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-GCM',false,['encrypt','decrypt']),topic:'t'+hex(bits.slice(32))};
 }
 async function decrypt(k,s){var d=u8(s);return dec(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},k,d.slice(12)));}
 async function encrypt(k,t){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,enc(t)));var o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o);}

 /* ---- permanent history in a private GitHub repo (items are encrypted with the chat key; only the sender writes) ---- */
 var gh=null,ghq=Promise.resolve(),quiet=false;
 function ghH(raw){return {Authorization:'Bearer '+gh.t,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'};}
 async function ghInit(){
  if(gh||!GH_SEAL)return;
  try{var d=u8(GH_SEAL);gh=JSON.parse(dec(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12)))));}
  catch(e){line('github: the sealed token does not match this password.','bad');return;}
  if(!await ghBranch()){line('github: could not open the history branch (check the token has Contents read/write on the repo).','bad');gh=null;}
 }
 async function ghBranch(){
  try{
   var u='https://api.github.com/repos/'+gh.r,r=await fetch(u+'/git/ref/heads/history',{headers:ghH()});
   if(r.ok)return true;
   if(r.status!==404)return false;
   var def=(await(await fetch(u,{headers:ghH()})).json()).default_branch;
   var sha=(await(await fetch(u+'/git/ref/heads/'+def,{headers:ghH()})).json()).object.sha;
   var c=await fetch(u+'/git/refs',{method:'POST',headers:ghH(),body:JSON.stringify({ref:'refs/heads/history',sha:sha})});
   return c.ok||c.status===422;
  }catch(e){return false;}
 }
 function ghSave(k,ts,bytes){
  if(!gh)return;
  ghq=ghq.then(async function(){
   for(var i=0;i<5;i++){
    try{
     var r=await fetch('https://api.github.com/repos/'+gh.r+'/contents/h/'+ts+'_'+k,{method:'PUT',headers:ghH(),body:JSON.stringify({message:'m',branch:'history',content:toB64(bytes)})});
     if(r.ok||r.status===422)return;
     if(r.status===401||r.status===403||r.status===404){line('github save failed ('+r.status+'): check the token and repo.','bad');return;}
    }catch(e){}
    await new Promise(function(f){setTimeout(f,1500*(i+1));});
   }
   line('github save failed. this item is only on the relay.','bad');
  });
 }
 async function ghSaveItem(k,meta,u){
  if(!gh)return;
  var h=enc(JSON.stringify(Object.assign({n:nick,ts:Date.now()},meta)));
  var pl=new Uint8Array(4+h.length+u.length);new DataView(pl.buffer).setUint32(0,h.length);pl.set(h,4);pl.set(u,4+h.length);
  ghSave(k,Date.now(),await encB(pl));
 }
 async function procPayload(k,d){
  var pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12)));
  var hl=new DataView(pl.buffer).getUint32(0);
  if(hl<2||hl>4096||hl>pl.length-4)return;
  var p=JSON.parse(dec(pl.slice(4,4+hl))),body=pl.slice(4+hl);
  if(p.pc>1){if(p.pc>8||p.pi<0||p.pi>=p.pc||typeof p.g!=='string')return;shown[k]=1;await dbPut(k,{k:k,part:true,p:p,b:new Blob([body])});await onPart(k,p);}
  else keepShow(k,p,body);
 }
 async function ghSync(){
  await ghInit();if(!gh)return;
  try{
   var r=await fetch('https://api.github.com/repos/'+gh.r+'/git/trees/history?recursive=1',{headers:ghH()});
   if(r.status===409)return;
   if(!r.ok){line('github: cannot read the repo ('+r.status+'). check the token and repo name.','bad');return;}
   var todo=[],tr=(await r.json()).tree||[];
   for(var i=0;i<tr.length;i++){
    var m=/^h\/(\d{13})_([A-Za-z0-9]+)$/.exec(tr[i].path);if(!m)continue;
    if(shown[m[2]]||await dbGet(m[2]))continue;
    todo.push({ts:+m[1],k:m[2],path:tr[i].path});
   }
   if(!todo.length)return;
   todo.sort(function(a,b){return a.ts-b.ts;});
   line('loading '+todo.length+' item(s) from github...','dim');
   quiet=true;
   for(i=0;i<todo.length;i++){
    try{
     var rr=await fetch('https://api.github.com/repos/'+gh.r+'/contents/'+todo[i].path+'?ref=history',{headers:ghH(true)});
     if(!rr.ok)continue;
     var d=new Uint8Array(await rr.arrayBuffer()),k=todo[i].k;
     if(k[0]==='t'){var p=JSON.parse(await decrypt(key,dec(d)));await dbPut(k,{k:k,txt:1,p:{n:String(p.n).slice(0,16),ts:p.ts,t:String(p.t).slice(0,500)}});}
     else await procPayload(k,d);
    }catch(e){}
   }
  }catch(e){}
  quiet=false;
 }
 function showText(p){var t=new Date(p.ts).toTimeString().slice(0,5);line('['+t+'] '+p.n+': '+p.t,p.n===nick?'me':'');}
 function connect(){ghSync().then(loadSaved).then(startES,startES);}
 function startES(){
  es=new EventSource(HOST+topic+'/sse?since='+(HOST===DEF?'12h':'all'));
  es.onopen=function(){if(!connect.up){line('connected. type /help for commands.','dim');connect.up=true;}};
  es.onerror=function(){if(connect.up){line('connection lost. reconnecting...','bad');connect.up=false;}};
  es.onmessage=async function(e){
   try{
    var m=JSON.parse(e.data);
    if(m.event!=='message'||seen[m.id])return;
    seen[m.id]=1;
    if(m.attachment){gotAttach(m);return;}
    var p=JSON.parse(await decrypt(key,m.message));
    if(p.x!==undefined){p._age=m.time?(Date.now()/1000-m.time):((Date.now()-p.ts)/1000);gotCall(p);return;}
    if(p.sg!==undefined){gotSig(p);return;}
    if(p.d!==undefined){gotChunk(p);return;}
    var tk='t'+m.id;
    if(shown[tk])return;
    shown[tk]=1;
    var tp={n:String(p.n).slice(0,16),ts:p.ts,t:String(p.t).slice(0,500)};
    showText(tp);
    dbPut(tk,{k:tk,txt:1,p:tp});
   }catch(err){}
  };
 }

var imgs={},MAXF=121500,SZ=2700;
 function human(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';}
 function gotChunk(p){
  var id=String(p.i).slice(0,24),c=p.c|0,k=p.k|0;
  if(c<1||c>100||k<0||k>=c||typeof p.d!=='string')return;
  var e=imgs[id]||(imgs[id]={parts:[],n:0,done:false});
  if(e.done||e.parts[k]!==undefined)return;
  e.parts[k]=p.d;e.n++;
  if(e.n!==c)return;
  e.done=true;
  var data=e.parts.join('');
  if(!/^[A-Za-z0-9+\/=]+$/.test(data))return;
  keepShow('c'+id,p,u8(data));
 }
 /* every received picture / voice message / file is saved on this device (IndexedDB) the moment it arrives,
    so it stays after the relay deletes it (ntfy.sh drops attachments after ~3 h) */
 var shown={},dbp=null;
 function db(){return dbp||(dbp=new Promise(function(res,rej){try{var r=indexedDB.open('chatfiles',1);r.onupgradeneeded=function(){r.result.createObjectStore('a');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}}));}
 function dbDo(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var st=d.transaction('a',mode).objectStore('a'),q=fn(st);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});});}
 function dbGet(k){return dbDo('readonly',function(s){return s.get(k);}).catch(function(){return null;});}
 function dbPut(k,v){return dbDo('readwrite',function(s){return s.put(v,k);}).catch(function(){});}
 function dbAll(){return dbDo('readonly',function(s){return s.getAll();}).catch(function(){return [];});}
 function keepShow(key,p,bin){
  if(shown[key])return;shown[key]=1;
  if(!quiet)render(p,bin);
  dbPut(key,{k:key,p:{n:p.n,ts:p.ts,kd:p.kd,m:p.m,dur:p.dur,fn:p.fn},b:bin});
 }
 async function loadSaved(){
  try{
   if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
   var all=(await dbAll()).filter(function(v){return v&&v.p&&!v.part;}).sort(function(a,b){return a.p.ts-b.p.ts;});
   if(!all.length)return;
   line('-- saved history --','dim');
   all.forEach(function(v){
    shown[v.k]=1;
    if(/^[ta]/.test(v.k))seen[v.k.slice(1)]=1;
    if(v.txt)showText(v.p);else render(v.p,v.b);
   });
   line('-- live --','dim');
  }catch(e){}
 }
 function render(p,bin){
  var kind=p.kd||'img',mime=String(p.m||'image/jpeg').slice(0,80);
  if(kind==='img'&&!/^image\/(jpeg|png|webp|gif)$/.test(mime))mime='image/jpeg';
  if(kind==='vm'&&!/^audio\//.test(mime))return;
  var t=new Date(p.ts).toTimeString().slice(0,5);
  var d=document.createElement('div');if(p.n===nick)d.className='me';
  d.textContent='['+t+'] '+String(p.n).slice(0,16)+': ';
  var url=URL.createObjectURL(new Blob([bin],{type:kind==='file'?'application/octet-stream':mime}));
  if(kind==='img'){
   var im=document.createElement('img');im.alt='image';im.onload=function(){log.scrollTop=log.scrollHeight;};
   im.src=url;d.appendChild(im);
  }else if(kind==='vm'){
   var au=document.createElement('audio');au.controls=true;au.src=url;
   d.appendChild(document.createTextNode('voice message '+(p.dur?p.dur+'s':'')));d.appendChild(au);
  }else{
   var a=document.createElement('a');a.href=url;a.download=String(p.fn||'file').replace(/[^\w.\- ]/g,'_').slice(0,80);
   a.textContent='[download '+a.download+' ('+human(bin.size!==undefined?bin.size:bin.length)+')]';d.appendChild(a);
  }
  log.appendChild(d);log.scrollTop=log.scrollHeight;
 }
 /* big items: encrypted with the chat key, uploaded as one ntfy attachment (up to ~15 MB, kept ~3 h) */
 var BIG=14000000;
 async function encB(u){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,u));var o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o;}
 async function sendBig(u,meta,label){
  if(u.length>BIG){line('too big (max '+human(BIG)+').','bad');return;}
  line('uploading '+label+' ('+human(u.length)+')...','dim');
  try{
   var h=enc(JSON.stringify(Object.assign({n:nick,ts:Date.now()},meta)));
   var pl=new Uint8Array(4+h.length+u.length);
   new DataView(pl.buffer).setUint32(0,h.length);pl.set(h,4);pl.set(u,4+h.length);
   var eb=await encB(pl);
   var r=await fetch(HOST+topic,{method:'POST',body:new Blob([eb])});
   if(!r.ok)throw new Error(r.status);
   var j=await r.json();
   ghSave('a'+j.id,Date.now(),eb);
   keepShow('a'+j.id,Object.assign({n:nick,ts:Date.now()},meta),u);
  }catch(err){line('upload failed ('+(err&&err.message||'error')+'). try again.','bad');}
 }
 var grp={};
 async function onPart(ak,p){
  var gk='g'+p.g;
  if(shown[gk])return;
  var G=grp[p.g]||(grp[p.g]={n:0,k:{}});
  if(G.k[p.pi]!==undefined)return;
  G.k[p.pi]=ak;G.n++;
  if(G.n<p.pc)return;
  var bl=[];
  for(var i=0;i<p.pc;i++){var e=await dbGet(G.k[i]);if(!e||!e.b)return;bl.push(e.b);}
  keepShow(gk,{n:p.n,ts:p.ts,kd:p.kd,m:p.m,dur:p.dur,fn:p.fn},new Blob(bl));
  for(i=0;i<p.pc;i++)dbPut(G.k[i],{k:G.k[i],part:true,done:true});
 }
 async function gotAttach(m){
  var at=m.attachment,ak='a'+m.id;
  if(shown[ak])return;
  var hit=await dbGet(ak);
  if(hit){shown[ak]=1;if(hit.done)return;if(hit.part){onPart(ak,hit.p);return;}if(hit.p){render(hit.p,hit.b);return;}}
  if(!at||typeof at.url!=='string'||at.url.indexOf(HOST)!==0||(at.size|0)>16000000)return;
  try{
   var r=await fetch(at.url);
   if(!r.ok){line('a file was sent but has expired (it was never saved on this device).','dim');return;}
   var d=new Uint8Array(await r.arrayBuffer());
   var pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12)));
   var hl=new DataView(pl.buffer).getUint32(0);
   if(hl<2||hl>4096||hl>pl.length-4)return;
   var p=JSON.parse(dec(pl.slice(4,4+hl)));
   if(p.pc>1){
    if(p.pc>8||p.pi<0||p.pi>=p.pc||typeof p.g!=='string')return;
    shown[ak]=1;
    await dbPut(ak,{k:ak,part:true,p:p,b:new Blob([pl.slice(4+hl)])});
    onPart(ak,p);return;
   }
   keepShow(ak,p,pl.slice(4+hl));
  }catch(e){}
 }
 /* files over ~14 MB (up to 100 MB): sent as several encrypted attachments and joined on arrival */
 var PART=14000000,TOTAL=104857600;
 async function sendParts(file,meta,label){
  if(file.size>TOTAL){line('file too large (max 100 MB, '+human(file.size)+' given).','bad');return;}
  var g=hex(crypto.getRandomValues(new Uint8Array(6))),pc=Math.ceil(file.size/PART),ts=Date.now();
  try{
   for(var i=0;i<pc;i++){
    line('uploading '+label+' part '+(i+1)+'/'+pc+'...','dim');
    var u=new Uint8Array(await file.slice(i*PART,(i+1)*PART).arrayBuffer());
    var h=enc(JSON.stringify(Object.assign({n:nick,ts:ts,g:g,pi:i,pc:pc,tot:file.size},meta)));
    var pl=new Uint8Array(4+h.length+u.length);
    new DataView(pl.buffer).setUint32(0,h.length);pl.set(h,4);pl.set(u,4+h.length);
    var eb=await encB(pl);
    var r=await fetch(HOST+topic,{method:'POST',body:new Blob([eb])});
    if(!r.ok)throw new Error(r.status===413?'the relay storage limit (100 MB per IP) is full, try again in a few hours':r.status);
    var j=await r.json();shown['a'+j.id]=1;ghSave('a'+j.id,Date.now(),eb);
   }
   keepShow('g'+g,Object.assign({n:nick,ts:ts},meta),file);
  }catch(err){line('upload failed ('+(err&&err.message||'error')+').','bad');}
 }
 async function sendPayload(u,meta,label){
  var b=toB64(u);
  if(b.length<=MAXF){var cid2=await sendData(b,meta,label);if(cid2)ghSaveItem('c'+cid2,meta,u);return;}
  return sendBig(u,meta,label);
 }
 async function sendData(b64,meta,label){
  var id=hex(crypto.getRandomValues(new Uint8Array(6))),c=Math.ceil(b64.length/SZ),ts=Date.now();
  if(c>50){line('too big for the relay (ntfy rate limit).','bad');return;}
  line('sending '+label+' ('+c+' parts)...','dim');
  try{
   for(var k=0;k<c;k++){
    var o={n:nick,ts:ts,i:id,k:k,c:c,d:b64.slice(k*SZ,(k+1)*SZ)};for(var q in meta)o[q]=meta[q];
    var r=await fetch(HOST+topic,{method:'POST',body:await encrypt(key,JSON.stringify(o))});
    if(!r.ok)throw new Error(r.status);
